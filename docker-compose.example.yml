services:
  tbmd-web:
    build: .
    container_name: telegram-media-downloader
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DOWNLOAD_DIR=/downloads
      - DB_PATH=/app/data/tbmd.db
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
    volumes:
      # Sessão criptografada, mídias, jobs e estado da fila no SQLite (evita
      # conflito de permissões do WAL com o bind mount do host)
      - tbmd-data:/app/data
      # Pasta padrão de downloads mapeada para o host/homelab
      - ./downloads:/downloads
      # Volumes extras opcionais do Homelab / NAS, acessíveis pelo navegador de pastas:
      # - /mnt/storage/media:/media
      # - /mnt/nas:/mnt/nas

volumes:
  tbmd-data:
