services:
  tbmd-web:
    build: .
    container_name: telegram-media-downloader
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DOWNLOAD_DIR=/downloads
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
    volumes:
      # Sessão autenticada do Telethon + fila SQLite (geradas na 1ª vez pelo painel web)
      - ./tbmd.db:/app/tbmd.db
      - ./tbmd.db-wal:/app/tbmd.db-wal
      - ./tbmd.db-shm:/app/tbmd.db-shm
      # Sessão legada do Telethon (usada apenas para a migração inicial)
      - ./default_session.session:/app/default_session.session
      # Pasta padrão de downloads mapeada para o host/homelab
      - ./downloads:/downloads
      # Exemplos de volumes extras do Homelab / NAS que aparecerão automaticamente na Web UI:
      # - /mnt/storage/media:/media
      # - /mnt/nas:/mnt/nas
