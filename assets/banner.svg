<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Telegram Media Downloader — baixe mídias em lote do Telegram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Telegram Media Downloader</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1021"/>
      <stop offset="1" stop-color="#111a3a"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b2df5"/>
      <stop offset="0.55" stop-color="#5b7cf7"/>
      <stop offset="1" stop-color="#5ad8f5"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf7"/>
      <stop offset="1" stop-color="#9fe8f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b7cf7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b7cf7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1d2850" stroke-width="1"/>
    </pattern>
    <path id="lane1" d="M245 115 C 430 18, 820 18, 1012 150"/>
        <path id="lane3" d="M215 245 C 270 345, 960 350, 1080 222"/>
    <g id="chip-video"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#1b2550" stroke="#8b5cf6"/><path d="M-4 -6 L7 0 L-4 6Z" fill="#c4b5fd"/></g>
    <g id="chip-img"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#1b2550" stroke="#22d3ee"/><path d="M-10 7 L-3 -1 L2 4 L5 1 L11 7Z" fill="#67e8f9"/><circle cx="6" cy="-5" r="2.6" fill="#67e8f9"/></g>
    <g id="chip-pdf"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#1b2550" stroke="#fb7185"/><text x="0" y="4.5" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" font-weight="700" fill="#fda4af">PDF</text></g>
    <g id="chip-zip"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#1b2550" stroke="#fbbf24"/><text x="0" y="4.5" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" font-weight="700" fill="#fcd34d">ZIP</text></g>
    <g id="chip-aud"><rect x="-17" y="-13" width="34" height="26" rx="6" fill="#1b2550" stroke="#34d399"/><path d="M-8 -2 v4 M-4 -6 v12 M0 -3 v6 M4 -8 v16 M8 -2 v4" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/></g>
  </defs>
  <style>
    .lane { fill: none; stroke: #2a3a78; stroke-width: 1.5; stroke-dasharray: 4 8; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .plane { animation: bob 4s ease-in-out infinite; transform-origin: 160px 170px; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(-2deg); } }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 160px 170px; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.08); } }
    .folder-glow { animation: fglow 1.2s ease-in-out infinite; }
    @keyframes fglow { 0%,100% { opacity: .25; } 50% { opacity: .7; } }
    .bar { animation: fill 3.6s ease-in-out infinite;  }
    @keyframes fill { 0% { transform: scaleX(0); } 70%,100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)" opacity="0.55"/>

  <!-- trilhas de mídia -->
  <use href="#lane1" class="lane"/>
  <use href="#lane3" class="lane"/>

  <!-- chips voando do Telegram para a pasta -->
  <use href="#chip-video"><animateMotion dur="3.2s" repeatCount="indefinite" rotate="0"><mpath href="#lane1"/></animateMotion></use>
  <use href="#chip-img"><animateMotion dur="3.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#lane1"/></animateMotion></use>
  <use href="#chip-pdf"><animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite"><mpath href="#lane3"/></animateMotion></use>
  <use href="#chip-zip"><animateMotion dur="3.2s" begin="-2.4s" repeatCount="indefinite"><mpath href="#lane1"/></animateMotion></use>
  <use href="#chip-aud"><animateMotion dur="3.2s" begin="-1.2s" repeatCount="indefinite"><mpath href="#lane3"/></animateMotion></use>
  <use href="#chip-video"><animateMotion dur="3.2s" begin="-2s" repeatCount="indefinite"><mpath href="#lane3"/></animateMotion></use>

  <!-- emblema -->
  <circle class="pulse" cx="160" cy="170" r="120" fill="url(#glow)"/>
  <g class="plane">
    <circle cx="160" cy="170" r="84" fill="url(#orb)"/>
    <path d="M108 160 L210 128 Q220 125 217 136 L190 228 Q186 240 176 231 L152 207 L134 222 Q128 227 128 219 L130 190 L106 172 Q98 165 108 160Z" fill="#c9fbf0"/>
    <path d="M130 190 L203 140 L152 207Z" fill="#7fdcd6" opacity="0.85"/>
  </g>

  <!-- texto -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="300" y="138" font-size="14" font-weight="600" letter-spacing="3" fill="#7dd3fc">CLI · WEB UI · HOMELAB</text>
    <text x="298" y="190" font-size="46" font-weight="800" fill="url(#title)">Telegram Media Downloader</text>
    <text x="300" y="228" font-size="19" fill="#a9b5d3">Baixe mídias em lote de canais, grupos e chats privados.</text>
    <g font-size="13" font-weight="600">
      <rect x="300" y="252" width="150" height="30" rx="15" fill="#16224a" stroke="#2f3f7f"/>
      <text x="375" y="272" text-anchor="middle" fill="#c4b5fd">Downloads paralelos</text>
      <rect x="460" y="252" width="140" height="30" rx="15" fill="#16224a" stroke="#2f3f7f"/>
      <text x="530" y="272" text-anchor="middle" fill="#67e8f9">Fila em SQLite</text>
      <rect x="610" y="252" width="150" height="30" rx="15" fill="#16224a" stroke="#2f3f7f"/>
      <text x="685" y="272" text-anchor="middle" fill="#6ee7b7">Retomada automática</text>
      <rect x="770" y="252" width="158" height="30" rx="15" fill="#16224a" stroke="#2f3f7f"/>
      <text x="849" y="272" text-anchor="middle" fill="#fcd34d">Sessão AES-256-GCM</text>
    </g>
  </g>

  <!-- pasta de destino -->
  <g transform="translate(1010 140)">
    <rect class="folder-glow" x="-14" y="-24" width="168" height="112" rx="20" fill="#22d3ee" opacity="0.3"/>
    <path d="M0 -6 Q0 -14 8 -14 L46 -14 L58 -2 L132 -2 Q140 -2 140 6 L140 72 Q140 80 132 80 L8 80 Q0 80 0 72Z" fill="#1a2a5c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="34" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#bae6fd">downloads/</text>
    <rect x="18" y="52" width="104" height="6" rx="3" fill="#0f1834"/>
    <rect class="bar" x="18" y="52" width="104" height="6" rx="3" fill="#34d399" style="transform-origin:18px 0"/>
  </g>
</svg>
